name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: launcher icon is fresh
        run: |
          pip install pillow==12.3.0
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          python3 tools/badge_icon.py "$VER"
          git diff --exit-code -- android/app/src/main/res || { echo "launcher icon is stale; run: python3 tools/badge_icon.py $VER and commit"; exit 1; }
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tagih-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulatorTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "KVM_OK"; else echo "KVM_UNAVAILABLE"; fi
      - name: run instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        with:
          api-level: 33
          arch: x86_64
          emulator-boot-timeout: 900
          script: |
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            bash tools/ci-emulator-tests.sh
            bash tools/ci-runtime-evidence.sh
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-diagnostics
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/tagih-logcat.txt
            ${{ runner.temp }}/tagih-runtime-1.png
            ${{ runner.temp }}/tagih-runtime-2.png
          if-no-files-found: ignore
